<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kablet Test Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      padding: 40px 16px;
    }

    main {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 14px;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 12px;
    }

    textarea {
      min-height: 100px;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      background: #111827;
      color: white;
      border: 0;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <main>
    <h1>Commercial Kitchen Equipment</h1>
    <p>Send us your business requirement.</p>

    <form id="inquiry-form">
      <label>
        First name
        <input name="firstName" required>
      </label>

      <label>
        Last name
        <input name="lastName" required>
      </label>

      <label>
        Email
        <input name="email" type="email" required>
      </label>

      <label>
        Company
        <input name="company" required>
      </label>

      <label>
        Requirement
        <textarea name="requirement" required></textarea>
      </label>

      <button type="submit">Submit inquiry</button>
    </form>

    <p id="success" style="display:none;color:green;">
      Your inquiry was submitted successfully.
    </p>
  </main>

  <script>
    window.KabletConfig = {
      siteKey: 'test_site_key_123456789',
      apiUrl: 'https://kablet-backend.onrender.com',
      formSelector: '#inquiry-form',
      category: 'commercial-kitchen-equipment',
      sourcePlatform: 'JAVASCRIPT',
      geography: 'UAE'
    };
  </script>

  <script src="/kablet.js"></script>

  <script>
    document
      .querySelector('#inquiry-form')
      .addEventListener('submit', function (event) {
        event.preventDefault();
        document.querySelector('#success').style.display = 'block';
      });
  </script>
</body>
</html>
